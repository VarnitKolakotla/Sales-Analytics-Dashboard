# Cloud-style stack on your laptop:  MinIO (S3-compatible object storage)  +  the analytics app
#   docker compose up --build
#   docker compose run --rm app python -m etl.generate_data --rows 2000000
#   docker compose run --rm app python -m etl.pipeline
#   open http://localhost:5000      (MinIO console: http://localhost:9001, user/pass below)
services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  app:
    build: .
    depends_on: [minio]
    ports: ["5000:5000"]
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      BUCKET_NAME: sales-analytics-lake
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: ap-south-1
    volumes: ["cache:/app/.cache"]

volumes:
  minio-data:
  cache:
